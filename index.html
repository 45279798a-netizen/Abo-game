<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0907">
    <title>Project Resonance · 戰鬥原型</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

    <!-- ───────── 編隊畫面 ───────── -->
    <section id="screen-setup" class="screen active">
        <header class="top">
            <div class="brand">
                <span class="brand-sub">PROJECT RESONANCE</span>
                <h1>戰鬥原型 <span class="brand-season">S1 亡靈的甦醒</span></h1>
            </div>
            <button id="btn-help" class="icon-btn" aria-label="玩法說明">?</button>
        </header>

        <h2 class="sec">選擇戰鬥</h2>
        <div id="encounter-list" class="enc-list"></div>

        <h2 class="sec">隊伍 <small>前 2 位站前排，後 3 位站後排</small></h2>
        <div id="team-slots" class="team-slots"></div>
        <div id="team-hint" class="team-hint"></div>
        <div id="presets" class="presets"></div>

        <h2 class="sec">英雄 <small>點一下加入隊伍，ⓘ 看技能</small></h2>
        <div id="hero-grid" class="hero-grid"></div>

        <div class="start-bar">
            <label class="auto-toggle"><input type="checkbox" id="chk-auto" checked> 自動戰鬥</label>
            <button id="btn-start" class="btn-primary">開始戰鬥</button>
        </div>
    </section>

    <!-- ───────── 戰鬥畫面 ───────── -->
    <section id="screen-battle" class="screen">
        <div class="b-top">
            <button id="btn-quit" class="icon-btn" aria-label="離開">✕</button>
            <div class="b-title">
                <div id="b-enc"></div>
                <div id="b-round"></div>
            </div>
            <button id="btn-auto" class="pill">自動</button>
            <button id="btn-speed" class="pill">x1</button>
            <button id="btn-pause" class="icon-btn" aria-label="暫停">❚❚</button>
        </div>

        <div class="timeline-wrap">
            <div class="timeline-label">行動順序</div>
            <div id="timeline" class="timeline"></div>
        </div>

        <div id="field-enemy" class="field enemy">
            <div class="row back"></div>
            <div class="row front"></div>
        </div>

        <div id="hud" class="hud">
            <div class="hud-chain">
                <div id="chain-label" class="chain-label">連鎖</div>
                <div id="chain-pips" class="pips"></div>
                <div id="combo-cd" class="combo-cd"></div>
            </div>
            <div class="hud-points">
                <div class="points-label">連攜點</div>
                <div id="points-pips" class="pips points"></div>
            </div>
            <button id="btn-chain" class="btn-chain" disabled>
                <span class="btn-chain-main">連攜！</span>
                <span id="btn-chain-sub" class="btn-chain-sub"></span>
            </button>
        </div>

        <div id="field-ally" class="field ally">
            <div class="row front"></div>
            <div class="row back"></div>
        </div>

        <div id="log" class="log"></div>
        <div id="banner" class="banner"></div>
        <div id="result" class="overlay"></div>
    </section>

    <div id="modal" class="overlay"></div>
</div>

<script src="js/data/elements.js"></script>
<script src="js/data/factions.js"></script>
<script src="js/data/heroes.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/core/battle.js"></script>
<script src="js/ui/app.js"></script>
</body>
</html>
