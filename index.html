<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Project Resonance · S1 亡靈的甦醒</title>
    <link rel="stylesheet" href="css/lobby.css">
</head>
<body>
<div id="lobby">
    <div class="lb-bg"></div>
    <div class="lb-light"></div>
    <div id="leader" class="lb-leader"><img alt=""><div id="leader-say" class="lb-say"></div></div>

    <div class="lb-top-left">
        <div class="lb-brand">PROJECT RESONANCE</div>
        <div class="lb-season"><b>S1</b> 亡靈的甦醒</div>
    </div>
    <div id="currency" class="lb-currency"></div>

    <nav class="lb-menu">
        <button class="lb-btn main" data-open="battle"><span class="i">⚔️</span><span class="t">出征</span><span class="s">主線・首領</span></button>
        <button class="lb-btn" data-open="hero"><span class="i">🛡️</span><span class="t">英雄</span><span class="s">編隊・養成</span></button>
        <button class="lb-btn" data-open="gacha"><span class="i">✨</span><span class="t">招募</span><span class="s" id="gacha-sub">S1 限定・烏瑟</span><i id="gacha-dot" class="dot"></i></button>
        <button class="lb-btn" data-open="bag"><span class="i">🎒</span><span class="t">背包</span><span class="s">道具</span></button>
        <div class="lb-mini">
            <a class="lb-mini-btn" href="gallery.html">特效圖鑑</a>
            <button class="lb-mini-btn" data-open="settings">設定</button>
        </div>
    </nav>

    <div id="team-strip" class="lb-team"></div>

    <!-- 子畫面 -->
    <section id="panel-battle" class="panel"></section>
    <section id="panel-hero" class="panel"></section>
    <section id="panel-gacha" class="panel"></section>
    <section id="panel-bag" class="panel"></section>
    <section id="panel-settings" class="panel"></section>
    <div id="hero-detail" class="detail"></div>
    <div id="pull-show" class="pull-show"></div>
    <div id="toast" class="toast"></div>
    <div id="rotate-hint" class="rotate-hint">📱↻ 橫放手機效果最好 <button id="rotate-ok">知道了</button></div>
</div>

<script src="js/data/elements.js"></script>
<script src="js/data/factions.js"></script>
<script src="js/data/heroes.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/data/vfxcolors.js"></script>
<script src="js/core/save.js"></script>
<script src="js/core/growth.js"></script>
<script src="js/core/gacha.js"></script>
<script src="js/lobby/main.js"></script>
</body>
</html>
