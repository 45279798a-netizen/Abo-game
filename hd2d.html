<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="assets/app/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Resonance">
    <title>Project Resonance · S1 亡靈的甦醒</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/hd2d.css">
    <script type="importmap">{"imports": {"three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/"}}</script>
</head>
<body>
<div id="hd">
    <canvas id="gl"></canvas>
    <div id="plates" class="plates"></div>
    <div id="flash" class="hd-flash"></div>
    <div id="vignette" class="hd-vignette"></div>

    <div class="hd-top-left">
        <a href="index.html" id="btn-back" class="g-btn" aria-label="離開">✕</a>
        <div class="b-col">
            <div class="b-title glass">
                <div id="b-enc">載入中…</div>
                <div id="b-round"></div>
            </div>
            <button id="fac-chip" class="fac-chip glass"></button>
        </div>
    </div>
    <div id="timeline" class="timeline glass"></div>
    <div id="boss-bar" class="boss-bar"></div>
    <div class="hd-top-right">
        <button id="btn-auto" class="g-btn wide">自動</button>
        <button id="btn-speed" class="g-btn wide">x1</button>
        <button id="btn-pause" class="g-btn" aria-label="暫停與設定">❚❚</button>
    </div>
    <div id="turn-pill" class="turn-pill"></div>

    <!-- 底部：我方英雄卡（生命、能量；能量滿了點卡片放大招） -->
    <div id="hud" class="hud2">
        <div id="ult-bar" class="cards"></div>
    </div>
    <div id="pause-menu" class="pause-menu"></div>

    <div id="skill-cut" class="skill-cut"><div class="sc-face"><img alt=""></div><div class="sc-text"><div class="sc-name"></div><div class="sc-hero"></div></div></div>
    <div id="ult" class="ult">
        <div class="ult-band"></div>
        <div id="ult-cast" class="ult-cast"></div>
        <div class="ult-text">
            <div class="ult-tag">ULTIMATE</div>
            <div id="ult-name" class="ult-name"></div>
            <div id="ult-fac" class="ult-fac"></div>
        </div>
        <div class="ult-skip">點一下跳過</div>
    </div>
    <div id="banner" class="banner"></div>
    <div id="result" class="overlay"></div>
    <div id="modal" class="overlay"></div>
    <div id="loading" class="hd-loading">戰場載入中…</div>
</div>

<script src="js/ui/shell.js"></script>
<script src="js/data/elements.js"></script>
<script src="js/data/factions.js"></script>
<script src="js/data/heroes.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/data/vfxcolors.js"></script>
<script src="js/data/gear.js"></script>
<script src="js/data/campaign.js"></script>
<script src="js/data/campaign_table.js"></script>
<script src="js/data/dungeons.js"></script>
<script src="js/data/dungeon_table.js"></script>
<script src="js/ui/icons.js"></script>
<script src="js/core/save.js"></script>
<script src="js/core/gear.js"></script>
<script src="js/data/quests.js"></script>
<script src="js/core/quests.js"></script>
<script src="js/data/season_table.js"></script>
<script src="js/core/season.js"></script>
<script src="js/core/battle.js"></script>
<script type="module" src="js/hd2d/main.js"></script>
</body>
</html>
