<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Project Resonance · HD-2D 戰鬥（試做）</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/hd2d.css">
    <script type="importmap">{"imports": {"three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/"}}</script>
</head>
<body>
<div id="hd">
    <canvas id="gl"></canvas>
    <div id="plates" class="plates"></div>
    <div id="flash" class="hd-flash"></div>

    <div class="hd-top-left">
        <a href="index.html" id="btn-back" class="g-btn" aria-label="離開">✕</a>
        <div class="b-title glass">
            <div id="b-enc">載入中…</div>
            <div id="b-round"></div>
        </div>
    </div>
    <div id="timeline" class="timeline glass"></div>
    <div class="hd-top-right">
        <button id="btn-auto" class="g-btn wide">自動</button>
        <button id="btn-speed" class="g-btn wide">x1</button>
        <button id="btn-quality" class="g-btn wide">畫質：高</button>
        <button id="btn-pause" class="g-btn" aria-label="暫停">❚❚</button>
    </div>
    <div id="turn-pill" class="turn-pill"></div>

    <div id="hud" class="hud glass">
        <div id="fac-bonus" class="fac-bonus"></div>
        <div id="ult-bar" class="ult-bar"></div>
    </div>

    <div id="skill-cut" class="skill-cut"><div class="sc-face"><img alt=""></div><div class="sc-text"><div class="sc-name"></div><div class="sc-hero"></div></div></div>
    <div id="ult" class="ult">
        <div class="ult-band"></div>
        <div id="ult-cast" class="ult-cast"></div>
        <div class="ult-text">
            <div class="ult-tag">ULTIMATE</div>
            <div id="ult-name" class="ult-name"></div>
            <div id="ult-fac" class="ult-fac"></div>
        </div>
        <div class="ult-skip">點一下跳過</div>
    </div>
    <div id="banner" class="banner"></div>
    <div id="result" class="overlay"></div>
    <div id="modal" class="overlay"></div>
    <div id="rotate-hint" class="rotate-hint">📱↻ 橫放手機效果最好 <button id="rotate-ok">知道了</button></div>
    <div id="loading" class="hd-loading">戰場載入中…</div>
</div>

<script src="js/data/elements.js"></script>
<script src="js/data/factions.js"></script>
<script src="js/data/heroes.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/core/battle.js"></script>
<script type="module" src="js/hd2d/main.js"></script>
</body>
</html>
